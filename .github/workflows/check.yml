# Runs the pre-deploy checks on pull requests, so problems show up
# before anything reaches the default branch and goes live.
name: Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check code
        run: npm test
